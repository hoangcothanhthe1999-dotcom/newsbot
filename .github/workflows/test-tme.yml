name: Thu doc t.me/s

# File thử riêng, chỉ chạy tay (Run workflow). Không đụng tới bot đang chạy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Thu doc 10 kenh qua t.me/s
        run: |
          python3 - <<'PY'
          import re, time, urllib.request, urllib.error
          chans = ["modgovkhm","moi_news","MFAICNEWS","mefcambodia","royalcambodianarmy",
                   "Dr_Hunmanetofcambodia","SarSokha_Speech","freshnewsasia",
                   "freshnewsinternational","khmertimesbreakingnews"]
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          ok = 0
          for c in chans:
              url = f"https://t.me/s/{c}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      html = r.read().decode("utf-8", "replace")
                      posts = len(re.findall(r'tgme_widget_message_wrap', html))
                      times = re.findall(r'<time[^>]*datetime="([^"]+)"', html)
                      last = times[-1] if times else "?"
                      print(f"{c:28} HTTP {r.status}  bai={posts:2}  moi_nhat={last}")
                      ok += 1 if posts else 0
              except urllib.error.HTTPError as e:
                  print(f"{c:28} HTTP {e.code}  LOI")
              except Exception as e:
                  print(f"{c:28} LOI {type(e).__name__}: {str(e)[:80]}")
              time.sleep(2)
          print(f"\nDoc duoc {ok}/{len(chans)} kenh tu may chu GitHub Actions")
          PY
