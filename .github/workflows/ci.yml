name: CI

# Cổng kiểm tra độc lập với phiên Claude: Ruff, Pyright, pytest cho mọi PR và mỗi lần đẩy lên main.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["**.py", "requirements.txt", "ruff.toml", ".github/workflows/ci.yml"]

permissions:
  contents: read             # quyền tối thiểu, không có khóa nào

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff pyright pytest
      - name: Ruff
        run: ruff check .
      - name: Pyright
        run: pyright
      - name: Pytest
        run: python -m pytest -q
