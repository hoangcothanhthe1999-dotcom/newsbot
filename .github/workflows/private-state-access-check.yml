name: Private state access check

on:
  pull_request:
    paths:
      - ".github/workflows/newsbot.yml"
      - ".github/workflows/private-state-access-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-private-state-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public bot source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout private runtime state (read-only test)
        uses: actions/checkout@v4
        with:
          repository: hoangcothanhthe1999-dotcom/newsbot-ops
          ref: main
          token: ${{ secrets.NEWSBOT_STATE_TOKEN }}
          path: .newsbot-state
          persist-credentials: false

      - name: Validate private state without exposing data
        shell: bash
        run: |
          set -euo pipefail
          test -s .newsbot-state/runtime-state/state.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(".newsbot-state/runtime-state/state.json")
          with path.open(encoding="utf-8") as stream:
              state = json.load(stream)
          required = {"offset", "owner", "chats", "items", "meta", "channels"}
          if not isinstance(state, dict) or not required.issubset(state):
              raise SystemExit("Private state validation failed.")
          print("Private state access and structural validation: PASS.")
          PY
