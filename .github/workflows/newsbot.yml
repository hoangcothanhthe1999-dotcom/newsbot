name: NewsBot

on:
  workflow_dispatch:          # cho phép bấm "Run workflow" để chạy tay

concurrency:
  group: newsbot              # chỉ 1 phiên chạy cùng lúc, phiên sau xếp hàng nối tiếp
  cancel-in-progress: false

permissions:
  contents: write             # để lưu state.json (chủ đề, từ khoá, tin đã gửi)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main             # lấy bản MỚI NHẤT lúc phiên bắt đầu chạy (không dùng bản lúc xếp hàng -> tránh gửi trùng)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          RUN_MINUTES: "55"
          CHECK_INTERVAL: "300"
          END_TIME_VN: "16:15"      # hết 16:15 giờ VN: phiên đang chạy tự dừng, phiên xếp hàng thoát ngay
          MAX_AGE_HOURS: "6"
          FETCH_FULLTEXT: "0"       # Boss chỉ cần tiêu đề + link: không mở nội dung bài báo
          APPS_PROXY_URL: ${{ secrets.APPS_PROXY_URL }}
          APPS_PROXY_KEY: ${{ secrets.APPS_PROXY_KEY }}
        run: python bot.py

      - name: Lưu sổ quyết định (artifact, giữ 1 ngày)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decisions-${{ github.run_id }}
          path: decisions.jsonl
          retention-days: 1
          if-no-files-found: ignore

      - name: Lưu trạng thái
        if: always()
        shell: bash
        run: |
          set -u
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          if [ ! -f state.json ]; then echo "::error::Không có state.json để lưu"; exit 1; fi
          if ! git add state.json; then echo "::error::git add state.json thất bại"; exit 1; fi
          if git diff --cached --quiet; then echo "Không có thay đổi state"; exit 0; fi
          if ! git commit -m "cập nhật state [skip ci]"; then echo "::error::git commit thất bại"; exit 1; fi
          for i in 1 2 3 4 5 6 7; do
            if git pull --rebase --autostash origin main; then
              if git push origin HEAD:main; then echo "Đã lưu state lên remote (lần $i)"; exit 0; fi
              echo "::warning::push thất bại lần $i"
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true
              echo "::error::Xung đột khi rebase (state.json): dừng để bảo toàn dữ liệu, cần xử lý thủ công"
              exit 1
            else
              echo "::warning::pull thất bại lần $i"
            fi
            sleep $((i*10 > 60 ? 60 : i*10))   # GitHub 500 thường kéo dài hơn vài giây (25/11: 3 lần cách 5-10s đều hỏng)
          done
          echo "::error::Không lưu được state lên remote sau 7 lần thử"
          exit 1
