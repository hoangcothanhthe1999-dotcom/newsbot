name: NewsBot

on:
  workflow_dispatch:          # cho phép bấm "Run workflow" để chạy tay

concurrency:
  group: newsbot              # chỉ 1 phiên chạy cùng lúc để tránh ghi đè state
  cancel-in-progress: false

permissions:
  contents: read              # mã nguồn chỉ đọc; state được ghi ở repository riêng tư

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Checkout kho state riêng tư
        uses: actions/checkout@v4
        with:
          repository: hoangcothanhthe1999-dotcom/newsbot-ops
          ref: main
          token: ${{ secrets.NEWSBOT_STATE_TOKEN }}
          path: .newsbot-state
          persist-credentials: true

      - name: Kiểm tra state trước khi chạy
        shell: bash
        run: |
          set -euo pipefail
          STATE_PATH=".newsbot-state/runtime-state/state.json"
          if [ ! -s "$STATE_PATH" ]; then
            echo "::error::Không tìm thấy state riêng tư; dừng để tránh khởi tạo state rỗng và gửi trùng."
            exit 1
          fi
          python - <<'PY'
          import json
          path = ".newsbot-state/runtime-state/state.json"
          with open(path, encoding="utf-8") as f:
              state = json.load(f)
          if not isinstance(state, dict):
              raise SystemExit("Private state must be a JSON object.")
          required = {"offset", "owner", "chats", "items", "meta", "channels"}
          missing = required.difference(state)
          if missing:
              raise SystemExit("Private state is missing required top-level fields.")
          print("Private state JSON and required structure: valid.")
          PY

      - run: pip install -r requirements.txt

      - name: Chạy bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          RUN_MINUTES: "55"
          CHECK_INTERVAL: "300"
          END_TIME_VN: "16:15"
          MAX_AGE_HOURS: "6"
          FETCH_FULLTEXT: "0"
          APPS_PROXY_URL: ${{ secrets.APPS_PROXY_URL }}
          APPS_PROXY_KEY: ${{ secrets.APPS_PROXY_KEY }}
          STATE_FILE: ${{ github.workspace }}/.newsbot-state/runtime-state/state.json
        run: python bot.py

      - name: Lưu sổ quyết định (artifact, giữ 1 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decisions-${{ github.run_id }}
          path: decisions.jsonl
          retention-days: 1
          if-no-files-found: ignore

      - name: Lưu trạng thái vào kho riêng tư
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          STATE_PATH=".newsbot-state/runtime-state/state.json"
          if [ ! -s "$STATE_PATH" ]; then
            echo "::error::Không có private state để lưu; không tạo state thay thế."
            exit 1
          fi
          git -C .newsbot-state config user.name "newsbot"
          git -C .newsbot-state config user.email "newsbot@users.noreply.github.com"
          git -C .newsbot-state add -- runtime-state/state.json
          if git -C .newsbot-state diff --cached --quiet; then
            echo "Private state không thay đổi."
            exit 0
          fi
          git -C .newsbot-state commit -m "cập nhật NewsBot runtime state [skip ci]"
          for i in 1 2 3 4 5 6 7; do
            if git -C .newsbot-state pull --rebase origin main; then
              if git -C .newsbot-state push origin HEAD:main; then
                echo "Đã lưu private state thành công (lần $i)."
                exit 0
              fi
              echo "::warning::Push private state thất bại lần $i."
            elif [ -d .newsbot-state/.git/rebase-merge ] || [ -d .newsbot-state/.git/rebase-apply ]; then
              git -C .newsbot-state rebase --abort || true
              echo "::error::Xung đột private state; dừng để bảo toàn dữ liệu."
              exit 1
            else
              echo "::warning::Không cập nhật được private state lần $i."
            fi
            sleep $((i * 10 > 60 ? 60 : i * 10))
          done
          echo "::error::Không lưu được private state sau 7 lần thử."
          exit 1
