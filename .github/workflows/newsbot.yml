name: NewsBot

on:
  schedule:
    - cron: "*/20 23,0-8 * * *"   # 06:00–15:40 giờ VN, 20 phút một lần
    - cron: "0 9 * * *"           # 16:00 giờ VN
  workflow_dispatch:          # cho phép bấm "Run workflow" để chạy tay

concurrency:
  group: newsbot              # chỉ 1 phiên chạy cùng lúc, phiên sau xếp hàng nối tiếp
  cancel-in-progress: false

permissions:
  contents: write             # để lưu state.json (chủ đề, từ khoá, tin đã gửi)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main             # lấy bản MỚI NHẤT lúc phiên bắt đầu chạy (không dùng bản lúc xếp hàng -> tránh gửi trùng)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          RUN_MINUTES: "55"
          CHECK_INTERVAL: "90"
          MAX_AGE_HOURS: "6"
        run: python bot.py

      - name: Lưu trạng thái
        if: always()
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "cập nhật state [skip ci]"
          git pull --rebase -X theirs || true
          git push
