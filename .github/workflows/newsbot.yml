name: NewsBot

on:
  schedule:
    - cron: "*/20 * * * *"   # cứ 20 phút GitHub gọi 1 lần; mỗi phiên bot chạy liên tục 55 phút
  workflow_dispatch:          # cho phép bấm "Run workflow" để chạy tay

concurrency:
  group: newsbot              # chỉ 1 phiên chạy cùng lúc, phiên sau xếp hàng nối tiếp
  cancel-in-progress: false

permissions:
  contents: write             # để lưu state.json (chủ đề, từ khoá, tin đã gửi)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chạy bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          RUN_MINUTES: "55"
          CHECK_INTERVAL: "180"
        run: python bot.py

      - name: Lưu trạng thái
        if: always()
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "cập nhật state [skip ci]"
          git pull --rebase -X theirs || true
          git push
