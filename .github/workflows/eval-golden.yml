name: EvalGolden

# Chạy TAY hoặc tự động sau merge (3 lần đo để thấy độ dao động) để đo độ sót/độ chính xác của bộ lọc AI trên bộ tin chuẩn (golden/golden_set.jsonl).
# Không gửi Telegram, không ghi repo. Tự động chỉ trên main (code đã duyệt).
# Đo TRƯỚC khi merge: chạy tay (Actions > EvalGolden > Run workflow) và nhập tên nhánh PR vào ô "ref".
# Chỉ người có quyền ghi vào repo mới chạy tay được; khóa AI chỉ vào bước đo, không có token Telegram.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhánh hoặc SHA cần đo (mặc định main)"
        required: false
        default: main
  push:                      # tự đo sau mỗi lần merge đụng lọc tin hoặc bộ chuẩn
    branches: [main]
    paths: ["bot.py", "sources.py", "eval_golden.py", "golden/**"]

permissions:
  contents: read             # quyền tối thiểu

concurrency:
  group: eval-golden         # không chạy chồng, tiết kiệm hạn mức AI
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Đo bộ lọc AI (chỉ khóa AI, KHÔNG có token Telegram)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        # Ngưỡng: sót 0% (recall 1.0), chính xác ≥ 90%, AI phải chấm đủ. Đỏ khi ≥ 2/3 lần đo không đạt (chịu được 1 lần AI dao động).
        run: |
          fails=0
          hfails=0
          for i in 1 2 3; do
            echo "=== Lần đo $i/3 ==="
            rc=0
            python eval_golden.py --min-recall 1.0 --min-precision 0.9 || rc=$?
            if [ $((rc & 1)) -ne 0 ] || [ $rc -ge 8 ] || [ $rc -eq 2 ]; then fails=$((fails+1)); fi
            if [ $((rc & 4)) -ne 0 ]; then hfails=$((hfails+1)); fi
          done
          echo "Số lần đo không đạt ngưỡng: $fails/3"
          echo "HOLDOUT: số lần đo không đạt ngưỡng: $hfails/3 (chỉ tính khi n>=5)"
          if [ "$fails" -ge 2 ]; then echo "::error::EvalGolden không đạt ngưỡng ở $fails/3 lần đo"; exit 1; fi
          if [ "$hfails" -ge 2 ]; then echo "::error::EvalGolden HOLDOUT không đạt ngưỡng ở $hfails/3 lần đo"; exit 1; fi
