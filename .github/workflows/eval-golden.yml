name: EvalGolden

# Chạy TAY hoặc tự động sau merge (3 lần đo để thấy độ dao động) để đo độ sót/độ chính xác của bộ lọc AI trên bộ tin chuẩn (golden/golden_set.jsonl).
# Không gửi Telegram, không ghi repo. Chỉ chạy trên nhánh main (code đã duyệt).
on:
  workflow_dispatch:
  push:                      # tự đo sau mỗi lần merge đụng lọc tin hoặc bộ chuẩn
    branches: [main]
    paths: ["bot.py", "sources.py", "eval_golden.py", "golden/**"]

permissions:
  contents: read             # quyền tối thiểu

concurrency:
  group: eval-golden         # không chạy chồng, tiết kiệm hạn mức AI
  cancel-in-progress: false

jobs:
  eval:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Đo bộ lọc AI (chỉ khóa AI, KHÔNG có token Telegram)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          for i in 1 2 3; do echo "=== Lần đo $i/3 ==="; python eval_golden.py || true; done
